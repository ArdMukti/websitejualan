<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Minuman Sutomo</title><link rel="stylesheet" href="/style.css"></head><body><header><nav><a class="logo" href="/">MINUMAN <span>SUTOMO</span></a><button id="logout" class="ghost">Logout</button></nav></header><main><h1>Panel Admin</h1><div id="stats" class="stats"></div><section class="card"><h2>Pengaturan QR DANA</h2><p>Masukkan URL gambar QR DANA. Bisa diganti kapan saja.</p><input id="qrUrl" placeholder="URL gambar QR DANA"><div id="qrPreviewWrap" class="hidden"><p>Preview:</p><img id="qrPreview" class="danaqr" alt="Preview QR DANA"></div><button id="saveQR">Simpan QR DANA</button> <span id="qrMsg"></span></section><section><h2>Pesanan</h2><div id="orders"></div></section><section><div class="sectionhead"><h2>Produk</h2><button id="add">Tambah Produk</button></div><div id="products"></div></section><div id="modal" class="modal hidden"><form id="productForm" class="card"><h2>Produk</h2><input type="hidden" name="id"><input name="name" placeholder="Nama" required><input name="description" placeholder="Deskripsi"><input name="price" type="number" placeholder="Harga" required><input name="stock" type="number" placeholder="Stok" required><input name="category" placeholder="Kategori"><input name="image" placeholder="URL gambar"><div><button type="submit">Simpan</button><button type="button" class="ghost" id="cancel">Batal</button></div></form></div></main><script src="/admin.js"></script></body></html>

<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Minuman Sutomo</title><link rel="stylesheet" href="/style.css"></head><body><div class="admin-shell"><aside class="admin-side"><div class="admin-brand"><span class="logo-mark"><svg viewBox="0 0 32 38"><path d="M8 9h16l-2 24H10L8 9Z"/><path d="M7 9h18M12 4c2 3 6 3 8 0M16 14v12M11 20c3 2 7 2 10 0"/></svg></span><span>Minuman Sutomo<br><small>Admin</small></span></div><nav class="admin-menu"><a class="active" href="/admin.html">▦ <span>Dashboard</span></a><a href="#orders">▤ <span>Pesanan</span></a><a href="#archive">▧ <span>Riwayat</span></a><a href="#products">▣ <span>Produk</span></a><a href="#users">♙ <span>Pengguna</span></a><a href="#" id="logout">↪ <span>Logout</span></a></nav></aside><main class="admin-main"><div class="admin-top"><div><h1>Daftar Pesanan</h1><small style="color:var(--muted)">Kelola pesanan, ubah status, dan produk Minuman Sutomo</small></div><button class="btn small" onclick="openForm()">+ Produk</button></div><div id="stats" class="stats"></div><section id="orders"><div class="panel">Memuat pesanan...</div></section><section id="archive" class="admin-product-list"><div class="admin-top" style="margin-top:28px"><div><h2 style="font-size:17px;margin:0">Riwayat Pesanan</h2><small style="color:var(--muted)">Pesanan hari sebelumnya otomatis diarsipkan setiap pergantian hari WITA.</small></div></div><div id="archiveList"><div class="panel">Memuat riwayat...</div></div></section><section id="products" class="admin-product-list"><div class="admin-top" style="margin-top:28px"><h2 style="font-size:17px;margin:0">Produk</h2></div><div id="productList"></div></section></main></div><div id="modal" class="modal hidden"><form id="productForm" class="admin-form"><div class="admin-top"><h2 style="margin:0;font-size:17px">Produk</h2><button type="button" class="icon-btn" onclick="closeForm()">×</button></div><input type="hidden" name="id"><div class="form-grid"><input class="full" name="name" placeholder="Nama minuman" required><textarea class="full" name="description" placeholder="Deskripsi"></textarea><input name="price" type="number" min="0" placeholder="Harga" required><input name="stock" type="number" min="0" placeholder="Stok" required><input name="category" placeholder="Kategori"><input name="image" placeholder="URL gambar (opsional)"></div><button class="btn" style="width:100%">Simpan Produk</button></form></div><script src="/admin.js"></script></body></html>
